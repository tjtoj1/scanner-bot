name: Scanner Bot 2
on:
  schedule:
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch:
concurrency:
  group: scanner-bot-2
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run FVG scanner
        env:
          ALPACA_KEY_2:    ${{ secrets.ALPACA_KEY_2 }}
          ALPACA_SECRET_2: ${{ secrets.ALPACA_SECRET_2 }}
          TG_TOKEN:        ${{ secrets.TG_TOKEN }}
        run: node

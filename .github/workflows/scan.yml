name: Scanner Bot

on:
  schedule:
    - cron: '*/5 13-20 * * 1-5'
  workflow_dispatch:

concurrency:
  group: scanner-bot
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scanner
        env:
          ALPACA_KEY:    ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TG_TOKEN:      ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:    ${{ secrets.TG_CHAT_ID }}
        run: node scan.js

      - name: Commit state (retry on conflict)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet && exit 0
          git commit -m "Update state [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed"; exit 0; fi
            echo "push conflict, rebasing (attempt $i)"
            git pull --rebase --autostash || true
            sleep 3
          done
          echo "::error::state.json push FAILED after 5 retries"
          exit 1
